services:
  # ── Backend (Flask) ───────────────────────────────────────────────────────
  - type: web
    name: airguard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_render:app -c gunicorn.conf.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      - key: DEBUG
        value: false
      - key: UPLOAD_FOLDER
        value: uploads
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: GEE_SERVICE_ACCOUNT
        sync: false
      - key: GEE_PROJECT
        sync: false
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      # NOTE: GEE_SERVICE_ACCOUNT_FILE and FCM_SERVICE_ACCOUNT_PATH
      # are local file paths — use GEE_SERVICE_ACCOUNT_JSON and
      # FCM_SERVICE_ACCOUNT_JSON env vars instead (see app_render.py)

  # ── Frontend (React/Vite) ─────────────────────────────────────────────────
  - type: web
    name: airguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
